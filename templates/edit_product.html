{% extends "base.html" %}
{% block title %}Edit Product — RUTHELYN COLLECTIONS{% endblock %}
{% block content %}
<style>
.edit-product-page{max-width:850px;margin:0 auto}.edit-product-card{background:#fff;padding:35px;margin-top:25px;border:1px solid #e5e5e5}
.edit-form{display:grid;gap:18px}.edit-form label{font-weight:600;margin-bottom:-10px}
.edit-form input,.edit-form select,.edit-form textarea{width:100%;padding:14px;border:1px solid #ccc;background:#fff;font:inherit;box-sizing:border-box}
.edit-form textarea{min-height:130px;resize:vertical}.current-product-image{max-width:220px;width:100%;height:auto;display:block;margin:10px 0}
.edit-checkbox{display:flex!important;align-items:center;gap:10px}.edit-checkbox input{width:auto}.edit-buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
</style>
<main class="section edit-product-page"><span class="eyebrow">STORE MANAGEMENT</span><h1>Edit Product</h1>
<div class="edit-product-card"><h2>{{ product.name }}</h2>
<form method="POST" enctype="multipart/form-data" class="edit-form">
<label>Product Name</label><input type="text" name="name" value="{{ product.name }}" required>
<label>Category</label><select name="category" required>
{% for c in ["Luxury Wears","Shoes","Bags","Jewellery & Accessories"] %}<option value="{{ c }}" {% if product.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}
</select>
<label>Price</label><input type="number" name="price" value="{{ product.price }}" min="0" step="0.01" required>
<label>Old Price</label><input type="number" name="old_price" value="{{ product.old_price or '' }}" min="0" step="0.01" placeholder="Leave blank if there is no old price">
<label>Sizes</label><input type="text" name="sizes" value="{{ product.sizes or '' }}" placeholder="Example: 44,46,48,50"><small>Separate sizes with commas.</small>
<label>Product Description</label><textarea name="description">{{ product.description or '' }}</textarea>
{% if product.image %}<label>Current Product Image</label><img class="current-product-image" src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.name }}">{% endif %}
<label>Replace Product Image</label><input type="file" name="image" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"><small>Leave empty to keep the current image.</small>
<label class="edit-checkbox"><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %}> Featured Product</label>
<label class="edit-checkbox"><input type="checkbox" name="sold" {% if product.sold %}checked{% endif %}> Sold Out</label>
<div class="edit-buttons"><button type="submit" class="btn btn-dark">SAVE CHANGES</button><a href="{{ url_for('admin') }}" class="btn btn-outline">CANCEL</a></div>
</form></div></main>{% endblock %}
